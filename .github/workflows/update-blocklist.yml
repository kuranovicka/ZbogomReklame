name: Update main blocklist

on:
  schedule:
    # Svaki dan u 03:17 UTC - van gustog saobracaja, van tacnog casa
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild glavnu listu iz svih 7 izvora (isto sto i Windows program)
        run: python3 tools/build_blocklist.py

      - name: Commit i push ako ima promena
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- zbogomreklame_hosts.txt; then
            echo "Nema promena, preskačem commit."
          else
            LINES=$(wc -l < zbogomreklame_hosts.txt)
            git add zbogomreklame_hosts.txt
            git commit -m "Automatsko dnevno azuriranje glavne liste ($LINES domena)"
            git push
          fi
