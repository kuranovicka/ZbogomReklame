name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        run: echo "${{ secrets.ZBOGOMREKLAME_KEYSTORE_BASE64 }}" | base64 -d > zbogomreklame-release.keystore

      - name: Build signed release APK
        env:
          ZBOGOMREKLAME_KEYSTORE_PATH: ${{ github.workspace }}/zbogomreklame-release.keystore
          ZBOGOMREKLAME_KEYSTORE_PASSWORD: ${{ secrets.ZBOGOMREKLAME_KEYSTORE_PASSWORD }}
          ZBOGOMREKLAME_KEY_ALIAS: ${{ secrets.ZBOGOMREKLAME_KEY_ALIAS }}
          ZBOGOMREKLAME_KEY_PASSWORD: ${{ secrets.ZBOGOMREKLAME_KEY_PASSWORD }}
        run: ./gradlew assembleRelease 2>&1 | tee build_output.txt
        continue-on-error: true
        id: build_step

      - name: Show real error if build failed
        if: steps.build_step.outcome == 'failure'
        run: |
          echo "::group::Full build output"
          cat build_output.txt
          echo "::endgroup::"
          grep -E "error:|FAILED|Exception|error " build_output.txt | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 1

      - name: Debug - list build outputs
        if: always()
        run: |
          echo "::warning::OUTPUTS TREE: $(find app/build/outputs -type f 2>&1 | tr '\n' '|' || echo NONE_OR_MISSING)"
          echo "::warning::APK GLOB MATCHES: $(ls -la app/build/outputs/apk/release/ 2>&1 | tr '\n' '|')"
          echo "::warning::KEYSTORE FILE: $(ls -la zbogomreklame-release.keystore 2>&1)"
          echo "::warning::GRADLE TAIL: $(tail -c 2000 build_output.txt 2>&1 | tr '\n' '|')"

      - name: Upload APK
        if: steps.build_step.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ZbogomReklame-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release with APK
        if: steps.build_step.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
